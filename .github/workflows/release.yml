name: Release `slidown`

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - id: version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          test "$TAG" = "v$version" || {
            echo "Tag $TAG does not match Cargo version v$version" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            binary: slidown
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary: slidown.exe
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary: slidown
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            binary: slidown
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl linker
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Install zstd (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes zstd
      - name: Install zstd (macOS)
        if: runner.os == 'macOS'
        run: brew install zstd
      - name: Install zstd (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install zstandard --no-progress --yes
      - name: Build binary
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Compress binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          name="slidown-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$name"
          zstd --rm --no-progress -q -19 "$name" -o "$name.zst"
      - name: Compress binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "slidown-${{ matrix.target }}"
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" $name
          zstd --rm --no-progress -q -19 "$name" -o "$name.zst"
      - name: Upload compressed binary
        uses: actions/upload-artifact@v7
        with:
          name: slidown-${{ matrix.target }}
          path: slidown-${{ matrix.target }}.zst
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: slidown-*
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum *.zst > SHA256SUMS
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$VERSION" \
            --generate-notes
