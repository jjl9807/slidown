[package]
name = "slidown"
version = "0.1.0"
edition = "2024"
description = "Build offline HTML slides from Markdown, with native Mermaid and LaTeX SVG rendering"
license = "MIT"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
comrak = { version = "0.55", default-features = false }
lightningcss = { version = "1.0.0-alpha.71", default-features = false }
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
oxc = { version = "0.149", features = ["codegen", "mangler", "minifier"] }
percent-encoding = "2"
quick-xml = "0.41"
ratex-parser = "0.1.14"
ratex-layout = "0.1.14"
ratex-types = "0.1.14"
ratex-svg = { version = "0.1.14", features = ["embed-fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.11"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }

[dev-dependencies]
roxmltree = "0.21"
