[changelog]
header = ""
body = """
## What's Changed
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}

{% for commit in commits %}\
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}**BREAKING:** {% endif %}\
{{ commit.message | split(pat="\n") | first | upper_first }} \
([{{ commit.id | truncate(length=7, end="") }}](https://github.com/jjl9807/slidown/commit/{{ commit.id }}))
{% endfor %}\
{% endfor %}
{% if github and github.contributors %}\
{% set new_contributors = github.contributors | filter(attribute="is_first_time", value=true) | filter(attribute="username") %}\
{% if new_contributors %}\
## New Contributors

{% for contributor in new_contributors %}\
- @{{ contributor.username }} made their first contribution\
{% if contributor.pr_number %} in [#{{ contributor.pr_number }}](https://github.com/jjl9807/slidown/pull/{{ contributor.pr_number }}){% endif %}.
{% endfor %}
{% endif %}\
{% endif %}\
{% if version and previous.version %}\
**Full Changelog**: https://github.com/jjl9807/slidown/compare/{{ previous.version }}...{{ version }}
{% endif %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->Features" },
    { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^refactor", group = "<!-- 3 -->Refactoring" },
    { message = "^docs?", group = "<!-- 4 -->Documentation" },
    { message = "^style", group = "<!-- 5 -->Styling" },
    { message = "^test", group = "<!-- 6 -->Testing" },
    { message = "^(build|ci|chore)", group = "<!-- 7 -->Maintenance" },
    { message = "^revert", group = "<!-- 8 -->Reverts" },
    { message = ".*", group = "<!-- 9 -->Other" },
]
filter_commits = false
tag_pattern = '^v[0-9]+\.[0-9]+\.[0-9]+([+-].*)?$'
use_branch_tags = true
sort_commits = "oldest"

[remote.github]
owner = "jjl9807"
repo = "slidown"
